name: aoi-image

# Lean image-only build for the AoiVPN fork. Upstream's release.yml also builds the
# one-command installer + a signed manifest (needs RELEASE_SIGNING_KEY) — we don't use
# those: we deploy via docker compose with MIKAN_IMAGE pinned to a tag from here.
# Builds amd64 only (all our nodes NL/SE/FI are x86_64) and pushes to ghcr.io/<owner>/mikan.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Extra image tag (e.g. 0.4.2-aoi1)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mikan" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
