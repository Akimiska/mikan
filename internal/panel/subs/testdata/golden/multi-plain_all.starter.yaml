mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.arpa'
    - time.*.com
    - time.*.gov
    - time.windows.com
    - ntp.*.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - connectivitycheck.*.com
    - connectivitycheck.gstatic.com
    - captive.apple.com
    - '*.push.apple.com'
    - stun.*.*
    - '*.stun.*.*'
    - +.roblox.com
    - +.rbxcdn.com
    - +.rbxcdn.net
    - +.rbxinfra.com
    - +.rbxgear.com
    - +.robloxlabs.com
    - +.rbx.com
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  prefer-h3: true
  respect-rules: true
proxy-groups:
  - name: VPN
    type: select
    include-all-proxies: true
rules:
  - DOMAIN-SUFFIX,sub.aoimusic.ru,VPN
  - DOMAIN-SUFFIX,panel.aoimusic.ru,VPN
  - DOMAIN-SUFFIX,vpn.aoimusic.ru,VPN
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,VPN
  - MATCH,REJECT
find-process-mode: always
