mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: false
geox-url:
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.arpa'
    - time.*.com
    - time.*.gov
    - time.windows.com
    - ntp.*.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - connectivitycheck.*.com
    - connectivitycheck.gstatic.com
    - captive.apple.com
    - '*.push.apple.com'
    - stun.*.*
    - '*.stun.*.*'
    - +.roblox.com
    - +.rbxcdn.com
    - +.rbxcdn.net
    - +.rbxinfra.com
    - +.rbxgear.com
    - +.robloxlabs.com
    - +.rbx.com
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query#VPN
    - https://8.8.8.8/dns-query#VPN
  nameserver-policy:
    +.aoimusic.ru:
      - https://1.1.1.1/dns-query#VPN
    geosite:category-ru:
      - 77.88.8.8
      - 77.88.8.1
  prefer-h3: true
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  respect-rules: true
proxy-groups:
  - name: VPN
    type: select
    include-all-proxies: true
rules:
  - DOMAIN-SUFFIX,sub.aoimusic.ru,VPN
  - DOMAIN-SUFFIX,panel.aoimusic.ru,VPN
  - DOMAIN-SUFFIX,vpn.aoimusic.ru,VPN
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,category-ru,DIRECT
  - GEOIP,ru,DIRECT
  - MATCH,VPN
  - MATCH,REJECT
find-process-mode: always
